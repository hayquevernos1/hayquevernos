<!doctype html>
<html lang="es-MX">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador ¡Hay que vernos!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: una columna tipo app; cabecera fija con avance, datos básicos editables, urgencia y precio por persona; una etapa por pantalla */
:root{
  --paper:#F7F4FC; --card:#FFFFFF; --ink:#23173A; --muted:#6B6280; --line:#E3DCF0;
  --grape:#7B2CBF; --grape-soft:#EFE4FB; --pink:#D6338A;
  --sun:#B8860B; --sun-soft:#FFF3D3; --orange:#C2570C; --orange-soft:#FFE8D6;
  --mint:#14806A; --mint-soft:#DDF5EE; --warn:#9A6A00; --warn-soft:#FFF4CC; --bad:#C0264B; --bad-soft:#FDE3E9;
  --f-display:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#140E22; --card:#1F1733; --ink:#F3EEFB; --muted:#ABA1C0; --line:#372C50;
  --grape:#B57BFF; --grape-soft:#2E1F4A; --pink:#FF6DB4;
  --sun:#FFD25E; --sun-soft:#3A2E12; --orange:#FF9F5A; --orange-soft:#3A2210;
  --mint:#4FD6B5; --mint-soft:#103329; --warn:#FFD25E; --warn-soft:#3A2E12; --bad:#FF7393; --bad-soft:#3D1522; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#140E22; --card:#1F1733; --ink:#F3EEFB; --muted:#ABA1C0; --line:#372C50;
  --grape:#B57BFF; --grape-soft:#2E1F4A; --pink:#FF6DB4;
  --sun:#FFD25E; --sun-soft:#3A2E12; --orange:#FF9F5A; --orange-soft:#3A2210;
  --mint:#4FD6B5; --mint-soft:#103329; --warn:#FFD25E; --warn-soft:#3A2E12; --bad:#FF7393; --bad-soft:#3D1522; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.app{max-width:700px;margin:0 auto;display:grid;gap:14px}
.proto{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-top:10px}
.proto b{background:var(--sun-soft);color:var(--warn);padding:2px 9px;border-radius:99px;font-size:11.5px;letter-spacing:.04em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);padding-block:8px;display:grid;gap:6px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stages span{height:6px;border-radius:99px;background:var(--line)}
.stages span.on{background:var(--grape)}.stages span.done{background:var(--mint)}
.basics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.basics label{display:grid;font-size:10.5px;color:var(--muted);font-weight:600;gap:1px;min-width:0}
.basics input{border:0;background:transparent;padding:2px 0;font-size:14px;font-weight:600;min-width:0;width:100%}
.basics input:focus{outline:none;border-bottom:2px solid var(--grape)}
.urg{display:flex;gap:8px;align-items:center;border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:600}
.urg .emo{font-size:15px}
.urg.u0{background:var(--mint-soft);color:var(--mint)}.urg.u1{background:var(--warn-soft);color:var(--warn)}.urg.u2{background:var(--orange-soft);color:var(--orange)}.urg.u3{background:var(--bad-soft);color:var(--bad)}
.pricebar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:16px;padding:8px 14px}
.pricebar small{display:block;font-size:11px;opacity:.75}
.pricebar .pp{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.pricebar .pp em{font-style:normal;font-size:13px;font-family:var(--f-body);opacity:.8;font-weight:500}
.pricebar .tt{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;opacity:.9}
.pricebar .tt b{font-size:15px}
.pricebar.empty .pp{opacity:.5}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.07)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:18px}
.vernie{display:flex;gap:12px;align-items:flex-end}
.vernie img{width:54px;height:54px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.bubble{background:var(--grape-soft);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:14.5px}
.bubble b{color:var(--grape)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}
.lbl{font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.opt{font-weight:400;color:var(--muted);font-size:12.5px}
.field{display:grid;gap:8px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--grape);outline:none}
textarea{min-height:56px;resize:vertical}
.miss{outline:2px solid var(--bad);outline-offset:2px;border-radius:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr));gap:8px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:11px 8px;display:grid;justify-items:center;gap:3px;font-size:13.5px;font-weight:600;text-align:center}
.tile .emo{font-size:26px;line-height:1}
.tile[aria-pressed="true"]{border-color:var(--grape);background:var(--grape-soft);color:var(--grape)}
.tile small{font-weight:500;color:var(--muted);font-size:11.5px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr));gap:6px}
.cat{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 8px;display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:500;text-align:left;line-height:1.15;min-height:40px}
.cat .emo{font-size:18px;flex:none}
.cat[aria-pressed="true"]{border-color:var(--grape);background:var(--grape);color:#fff}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:7px 16px;font-weight:600;font-size:13.5px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--grape);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--grape-soft);color:var(--grape);border-color:var(--grape)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700}
.counter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.counter button.pm{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;line-height:1}
.counter input{text-align:center;font-family:var(--f-display);font-size:24px;font-weight:600;max-width:130px}
.tip{display:flex;gap:8px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:13.5px}
.tip .emo{font-size:18px;line-height:1.2}
.tip.good{background:var(--mint-soft);color:var(--mint)}.tip.warn{background:var(--warn-soft);color:var(--warn)}.tip.orange{background:var(--orange-soft);color:var(--orange)}.tip.bad{background:var(--bad-soft);color:var(--bad)}.tip.info{background:var(--grape-soft);color:var(--grape)}
.tips{display:grid;gap:8px}
.svc{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--card)}
.svc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.svc-head b{font-size:15px}
.mini-l{font-size:12.5px;font-weight:600;color:var(--muted)}
.bud{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:6px;background:var(--card)}
.bud-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud-top b{font-size:15px}
.bud-top .amt{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.bud-top .amt small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:500}
.track{position:relative;padding-top:18px}
.track .mark{top:12px!important}
.track .mark{position:absolute;top:-2px;width:2px;height:26px;background:var(--ink);border-radius:2px;pointer-events:none}
.track .mark::after{content:"promedio";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--grape)}
.zones{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.avg{font-size:12px;color:var(--muted)}
.avg s{opacity:.7}.avg b{color:var(--mint)}
.lvl{font-size:12.5px;font-weight:700}
.lvl.lo{color:var(--bad)}.lvl.un{color:var(--muted)}.lvl-row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.track.unset input{opacity:.45}.lvl.mid{color:var(--sun)}.lvl.hi{color:var(--mint)}
.prize{display:flex;gap:10px;align-items:center;background:linear-gradient(120deg,var(--mint-soft),var(--grape-soft));border-radius:16px;padding:12px 14px;font-size:13.5px}
.prize .emo{font-size:28px}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--grape);color:#fff;font-size:15.5px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.big{font-family:var(--f-display);font-size:19px;font-weight:600;padding:15px 22px}
.btn.wa{background:#1F8A5B}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.off{opacity:.45}
.btn:disabled{opacity:.6;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13.5px;font-weight:600;margin:0}
.up{border:2px dashed var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--paper)}
label.pick{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;width:fit-content}
label.pick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.specs{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px}
.specs b{color:var(--ink);font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr));gap:8px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;display:block}
.ph .q{padding:5px 7px;font-size:11px;display:grid;gap:1px}
.q .good{color:var(--mint);font-weight:700}.q .meh{color:var(--warn);font-weight:700}
.ph button{border:0;background:none;color:var(--bad);font-size:11.5px;font-weight:600;padding:0 7px 5px;text-align:left}
.result-hero{background:linear-gradient(160deg,var(--grape),var(--pink));color:#fff;border-radius:22px;padding:22px;display:grid;gap:6px;text-align:center}
.result-hero .big{font-family:var(--f-display);font-size:clamp(38px,9vw,54px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result-hero .tt{font-size:15px;opacity:.95}
.result-hero small{opacity:.85}
.break{display:grid;gap:2px;font-size:14px}
.break>div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.break>div span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.break .sub{font-size:12px;color:var(--muted);font-weight:400}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--paper);border-radius:12px;padding:12px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--grape);flex:none}
.planners{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.pc{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);display:grid;text-align:left;padding:0}
.pc[aria-pressed="true"]{border-color:var(--grape);box-shadow:0 0 0 3px var(--grape-soft)}
.pc .ph2{aspect-ratio:4/3;display:grid;place-items:center;font-size:56px;background:var(--grape-soft);position:relative;max-width:100%}
.pc .ph2 .like{position:absolute;top:8px;right:8px;background:var(--card);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--grape)}
.pc .bd{padding:10px 12px;display:grid;gap:4px;font-size:12.5px}
.pc .bd b{font-family:var(--f-display);font-size:17px;font-weight:600}
.pc .bd .feat{display:flex;flex-wrap:wrap;gap:4px}
.pc .bd .feat span{background:var(--paper);border-radius:99px;padding:2px 8px;font-size:11px}
.cov{display:grid;gap:8px}
.cov-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);font-size:14px}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st.wait{background:var(--paper);color:var(--muted)}.st.ok{background:var(--mint-soft);color:var(--mint)}.st.pl{background:var(--grape-soft);color:var(--grape)}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--grape),var(--pink),#FFC83D);transition:width .5s}
.prov{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background:var(--card)}
.prov-top{display:flex;gap:10px;align-items:center}
.prov-top .av{width:42px;height:42px;border-radius:50%;background:var(--grape);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none}
.prov-top div{min-width:0}
.prov-top small{color:var(--muted)}
.lock{filter:blur(5px);user-select:none}
.ex{font-size:11px;font-weight:700;color:var(--warn);background:var(--sun-soft);border-radius:99px;padding:2px 8px;width:fit-content}
.agenda{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.ag2{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:6px 8px;background:var(--card);text-align:left}
.ag2 .dt{text-align:center;background:var(--paper);border-radius:10px;padding:3px 0;line-height:1.05}
.ag2 .dt b{display:block;font-family:var(--f-display);font-size:17px}
.ag2 .dt small{font-size:10px;font-weight:600;text-transform:uppercase}
.ag2 .tx{font-size:12.5px;font-weight:600;min-width:0}
.ag2 .tx small{display:block;color:var(--muted);font-size:10.5px;font-weight:500}
.ag2.on{border-color:var(--grape);background:var(--grape-soft)}
.ag2.on .dt{background:var(--grape);color:#fff}
.ag{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
.ag .dt{text-align:center;background:var(--grape-soft);border-radius:10px;padding:4px 0;line-height:1.1}
.ag .dt b{display:block;font-family:var(--f-display);font-size:20px;color:var(--grape)}
.ag .dt small{font-size:11px;color:var(--grape);font-weight:600;text-transform:uppercase}
.ag .tx{font-size:13.5px;min-width:0}
.ag .tx small{display:block;color:var(--muted);font-size:11.5px}
.ag.mine{border-color:var(--grape)}
.provview{border:2px dashed var(--line);border-radius:16px;padding:12px;font-size:13px;display:grid;gap:6px;background:var(--paper)}
.provview .wabub{background:#DCF8C6;color:#1b2b16;border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:13px;max-width:420px}
.addr-box{display:grid;gap:8px}.addr-cp{display:grid;gap:4px}
.addr-street{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.addr-ok{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--mint-soft);border-radius:12px;padding:8px 10px;font-size:13px}
.addr-ok a{color:var(--grape);font-weight:700}
.chk-in{display:flex;gap:6px;align-items:center;font-weight:600}.chk-in input{width:18px;height:18px;accent-color:var(--grape)}
.link-btn{background:none;border:0;color:var(--grape);font-weight:700;padding:0;text-decoration:underline;font-size:12.5px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
.carousel .pc{flex:0 0 min(78%,250px);scroll-snap-align:start}
.trk{display:flex;flex-wrap:wrap;gap:6px}
.trk span{display:inline-flex;gap:5px;align-items:center;border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12.5px;background:var(--card);white-space:nowrap}
.trk span.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint);font-weight:700}
.trk span.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps-list li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px}
.steps-list li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--grape);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.steps-list li.done::before{content:"✓";background:var(--mint)}
.wa-card{background:#DCF8C6;color:#1b2b16;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px;max-width:440px}
.wa-card .row2{display:flex;gap:6px;flex-wrap:wrap}
.wa-card button{border:0;border-radius:10px;padding:7px 12px;font-weight:700;background:#fff;color:#128C7E}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (max-width:560px){
  .card{padding:15px}
  .addr-street{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .addr-street input:first-child{grid-column:1/-1}
  .basics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .cat{font-size:11.5px;padding:5px 6px;gap:4px;min-height:36px}
  .cat .emo{font-size:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pricebar .pp{font-size:24px}
  .top{gap:4px;padding-block:6px}
  .basics{padding:4px 8px;gap:2px 8px}
  .basics label{font-size:10px}
  .basics input{font-size:13px;padding:0}
  .urg{padding:4px 10px;font-size:12px}
  .pricebar{padding:6px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{overflow-x:clip}
.vlive{border:2px dashed var(--grape);border-radius:14px;padding:10px 12px;display:grid;gap:4px;background:var(--grape-soft);font-size:14px}
.vlive.none{border-color:var(--orange);background:var(--sun-soft)}

const SVC=window.HQV_SVC,CONV=window.HQV_CONV,REF=CONV.ref;
const CATS=SVC.cats.map(c=>({n:c.n,e:c.e,s:c.s.map(([n,t,u])=>[n,t,u])}));
const FLAT={};CATS.forEach(c=>c.s.forEach(x=>{FLAT[c.n+"|"+x[0]]=Object.keys(FLAT).length;}));
const catOf=n=>CATS.find(c=>c.n===n);
const subOf=(c,s)=>{const k=catOf(c);return k&&k.s.find(x=>x[0]===s);};

function excluded(){const l=(SVC.ev[KEY()]||[]).find(x=>x[0]===S.occ);return new Set(l?l[2]:[]);}
const subVisible=(c,s,ex=excluded())=>{const x=subOf(c,s);return !!x&&x[1].includes(KEY())&&!ex.has(FLAT[c+"|"+s]);};

/* ---------- Tiempo, urgencia y premio por anticipación ---------- */
function hours(){if(!S.start||!S.end)return 5;const f=t=>{const [h,m]=t.split(":").map(Number);return h+m/60;};let d=f(S.end)-f(S.start);if(d<=0)d+=24;return Math.round(d*10)/10;}
function daysTo(){if(!S.date)return null;const d=new Date(S.date+"T12:00"),n=new Date();n.setHours(12,0,0,0);return Math.round((d-n)/864e5);}
function urgency(){const d=daysTo();if(d===null)return null;
 if(d<0)return{k:3,e:"⛔",t:"Esa fecha ya pasó",x:"Elige una fecha futura."};
 if(d>=60)return{k:0,e:"🟢",t:`Tiempo ideal · faltan ${d} días`,x:"Con 2 meses o más tienes las mejores opciones y precios."};
 if(d>=30)return{k:1,e:"🟡",t:`Se está complicando · faltan ${d} días`,x:"Entre 1 y 2 meses todavía hay opciones, pero los mejores proveedores se van apartando."};
 if(d>=15)return{k:2,e:"🟠",t:`Peligroso · faltan ${d} días`,x:"Con menos de un mes hay pocas opciones y menos margen para negociar."};
 return{k:3,e:"🔴",t:`Modo apagar fuegos · faltan ${d} días`,x:"Menos de 15 días: hay que moverse hoy mismo. Muchos proveedores ya no tienen lugar."};}
function earlyFactor(){const d=daysTo();if(d===null)return 1;return d>=60?0.9:d>=30?0.95:1;}
function earlyPct(){return Math.round((1-earlyFactor())*100);}

function lineCalc(cat,sub,g){const r=REF[cat+"|"+sub];if(!r)return{total:0,pend:true};return hqvCost({cat,sub,u:r[0],price:r[1],pkgP:r[2],guests:g,hours:hours()});}

const linePend=(cat,sub)=>!!lineCalc(cat,sub,S.guests).pend;
const catAvg=(c,g)=>(S.sel[c]||[]).reduce((a,s)=>a+lineCost(c,s,g),0);
function rows(g=S.guests){const out=[],ef=earlyFactor();
 if(S.hasPlace===false){const vm=venueMatch(g),inc=fromVenueCats();out.push({k:"Venue",e:"🏛️",label:"Venue"+(inc.length?" con "+inc.join(", ").toLowerCase():" (renta del espacio)"),subs:vm.ok.length?[`Promedio de ${vm.ok.length} ${vm.ok.length===1?"venue que cumple":"venues que cumplen"} lo que pides`]:["Promedio general (aún no hay venues que cumplan todo)"],avg:vm.avg});}
 Object.keys(S.sel).forEach(c=>{if(!S.sel[c].length)return;const inVenue=S.hasPlace===false&&(S.meta[c]||{}).who==="venue"&&hasPolicy(c);if(inVenue)return;const pend=S.sel[c].filter(s=>linePend(c,s));out.push({k:c,e:catOf(c).e,label:c,subs:S.sel[c],pend,avg:catAvg(c,g),pendOnly:pend.length===S.sel[c].length});});
 if(S.wantPlanner)out.push({k:"Planner",e:"📋",label:"Event planner",avg:planCost(g)});
 out.forEach(r=>{r.mkt=r.avg;r.avg=r.avg*ef;r.set=S.factor[r.k]!==undefined||!!r.pendOnly;r.f=r.set?(S.factor[r.k]??1):1;r.amt=r.set?r.avg*r.f:0;});return out;}

const OK_IMG=["image/jpeg","image/png","image/webp"];
function checkFile(f){const n=f.name||"archivo";if(/\.(heic|heif)$/i.test(n)||/heic|heif/.test(f.type))return`"${n}" está en formato HEIC (iPhone). Cámbialo en Ajustes › Cámara › Formatos › "Más compatible", o envíatela por WhatsApp y descárgala.`;
 if(!OK_IMG.includes(f.type))return`"${n}" no es una imagen compatible. Usa JPG, PNG o WebP.`;if(f.size>8*1048576)return`"${n}" pesa ${(f.size/1048576).toFixed(1)} MB; el máximo es 8 MB.`;return null;}
function loadImage(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});}
function quality(im){const W=200,sc=W/Math.max(im.width,im.height),w=Math.max(8,Math.round(im.width*sc)),h=Math.max(8,Math.round(im.height*sc));const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
 const g=new Float32Array(w*h);let s=0;for(let i=0;i<w*h;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];s+=g[i];}const mean=s/(w*h);let v=0;for(let i=0;i<w*h;i++)v+=(g[i]-mean)**2;const sd=Math.sqrt(v/(w*h));
 let ls=0,lq=0,n=0;for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const i=y*w+xx,L=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];ls+=L;lq+=L*L;n++;}const lap=lq/n-(ls/n)**2;const out=[];
 if(Math.min(im.width,im.height)<800)out.push("📏 Baja resolución");if(mean<70)out.push("🌑 Muy oscura");else if(mean>215)out.push("☀️ Muy clara");if(sd<28)out.push("🌫️ Sin contraste");if(lap<55)out.push("🫨 Borrosa");return out;}
function optimize(im){const M=1400,sc=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let u=c.toDataURL("image/webp",.8);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/jpeg",.8);return u;}

function popularDates(){const y=new Date().getFullYear(),list=[];const third=(yy,m)=>{const d=new Date(yy,m,1);const add=(7-d.getDay())%7;return new Date(yy,m,1+add+14);};

function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("conf");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#7B2CBF","#D6338A","#FFC83D","#14806A","#5BC0EB"];
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<160)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.hidden=true;}})();}
